name: Qoder Daily Checkin

on:
  schedule:
    # 北京时间 10:10（UTC 02:10），签到每天 10:00（UTC+8）刷新
    - cron: '10 23 * * *'
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    env:
      QODER_AUTH: ${{ secrets.QODER_AUTH }}
      QODER_MACHINETOKEN: ${{ secrets.QODER_MACHINETOKEN }}
      QODER_MACHINECODE: ${{ secrets.QODER_MACHINECODE }}
      QODER_MACHINEID: ${{ secrets.QODER_MACHINEID }}
      SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
      # 统一客户端指纹，三个请求共用，模拟真实 QoderCN 0.4.4 客户端
      UA: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) QoderCN/0.4.4 Chrome/150.0.7871.114 Electron/43.1.1 Safari/537.36'
      COSY_VERSION: '0.4.4'
      COSY_MACHINE_OS: 'x86_64_win32'
      COSY_MACHINE_HOSTNAME: 'Mee-Laptop'
      COSY_MACHINE_TYPE: 'aeef549c1464f27d6a'
      ORIGIN: 'https://openapi.qoder.com.cn'
      REFERER: 'https://openapi.qoder.com.cn/growth-page/activity-iframe'

    steps:
      # ---------- 1. 查询活动列表 ----------
      - name: Query campaigns
        run: |
          echo "=== 1. 查询活动列表 ==="
          curl -sS -X GET 'https://openapi.qoder.com.cn/sash/api/v1/me/campaigns' \
            -H 'Connection: keep-alive' \
            -H 'sec-ch-ua-platform: "Windows"' \
            -H "User-Agent: ${UA}" \
            -H 'sec-ch-ua: "Not;A=Brand";v="8", "Chromium";v="150"' \
            -H 'sec-ch-ua-mobile: ?0' \
            -H 'Accept: */*' \
            -H 'Sec-Fetch-Site: same-origin' \
            -H 'Sec-Fetch-Mode: cors' \
            -H 'Sec-Fetch-Dest: empty' \
            -H "Referer: ${REFERER}" \
            -H 'Accept-Language: zh-CN' \
            -H "Authorization: Bearer ${QODER_AUTH}" \
            -H 'Cosy-ClientType: 10' \
            -H "Cosy-Version: ${COSY_VERSION}" \
            -H "Cosy-MachineOS: ${COSY_MACHINE_OS}" \
            -H "Cosy-MachineHostname: ${COSY_MACHINE_HOSTNAME}" \
            -H "Cosy-MachineId: ${QODER_MACHINEID}" \
            -H "Cosy-MachineToken: ${QODER_MACHINETOKEN}" \
            -H "Cosy-MachineCode: ${QODER_MACHINECODE}" \
            -H "Cosy-MachineType: ${COSY_MACHINE_TYPE}" \
            --compressed -o /tmp/campaigns.json -w '%{http_code}' > /tmp/campaigns.code
          echo "HTTP=$(cat /tmp/campaigns.code)"
          cat /tmp/campaigns.json; echo

      # ---------- 2. 解析活动 ID ----------
      - name: Parse campaign id
        id: parse
        run: |
          python3 - <<'PY'
          import json, os

          raw = open('/tmp/campaigns.json').read()
          # 阿里云盾可能在 JSON 前后插入噪音（abb / 498 / 0 等），从第一个 { 开始解析
          start = raw.find('{')
          if start < 0:
              print('响应里没有 JSON，可能被风控拦截')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write('skip=true\n')
                  f.write('campaign_id=\n')
              raise SystemExit(1)

          try:
              obj, _ = json.JSONDecoder().raw_decode(raw[start:])
          except Exception as e:
              print('JSON 解析失败:', e)
              raise SystemExit(1)

          target = None
          for c in obj.get('campaigns', []):
              # 签到特征：可领取 + CREDITS + 100 额度
              if c.get('claimStatus') == 'CLAIMABLE' \
                 and c.get('benefit', {}).get('kind') == 'CREDITS' \
                 and c.get('benefit', {}).get('amount') == 100:
                  target = c
                  break

          out = os.environ['GITHUB_OUTPUT']
          if not target:
              print('没有可领取的签到活动（可能今天已领过）')
              with open(out, 'a') as f:
                  f.write('skip=true\n')
                  f.write('campaign_id=\n')
          else:
              cid = target['campaignId']
              print(f"找到签到活动: {cid} (key={target.get('campaignKey')})")
              with open(out, 'a') as f:
                  f.write('skip=false\n')
                  f.write(f'campaign_id={cid}\n')
          PY

      # ---------- 3. 签到 ----------
      - name: Claim reward
        if: steps.parse.outputs.skip != 'true'
        env:
          CAMPAIGN_ID: ${{ steps.parse.outputs.campaign_id }}
        run: |
          echo "=== 2. 签到（$CAMPAIGN_ID） ==="
          curl -sS -X POST \
            "https://openapi.qoder.com.cn/sash/api/v1/me/campaigns/${CAMPAIGN_ID}/claim" \
            -H 'Connection: keep-alive' \
            -H 'Content-Length: 0' \
            -H 'sec-ch-ua-platform: "Windows"' \
            -H "User-Agent: ${UA}" \
            -H 'sec-ch-ua: "Not;A=Brand";v="8", "Chromium";v="150"' \
            -H 'sec-ch-ua-mobile: ?0' \
            -H 'Accept: */*' \
            -H "Origin: ${ORIGIN}" \
            -H 'Sec-Fetch-Site: same-origin' \
            -H 'Sec-Fetch-Mode: cors' \
            -H 'Sec-Fetch-Dest: empty' \
            -H 'Sec-Fetch-Storage-Access: active' \
            -H "Referer: ${REFERER}" \
            -H 'Accept-Language: zh-CN' \
            -H "Authorization: Bearer ${QODER_AUTH}" \
            -H 'Cosy-ClientType: 10' \
            -H "Cosy-Version: ${COSY_VERSION}" \
            -H "Cosy-MachineOS: ${COSY_MACHINE_OS}" \
            -H "Cosy-MachineHostname: ${COSY_MACHINE_HOSTNAME}" \
            -H "Cosy-MachineId: ${QODER_MACHINEID}" \
            -H "Cosy-MachineToken: ${QODER_MACHINETOKEN}" \
            -H "Cosy-MachineCode: ${QODER_MACHINECODE}" \
            -H "Cosy-MachineType: ${COSY_MACHINE_TYPE}" \
            --compressed -o /tmp/claim.json -w '%{http_code}' > /tmp/claim.code
          echo "HTTP=$(cat /tmp/claim.code)"
          cat /tmp/claim.json; echo

      # ---------- 4. 随机等待 ----------
      - name: Random wait
        run: |
          DELAY=$((RANDOM % 8 + 3))
          echo "等待 ${DELAY} 秒..."
          sleep "$DELAY"

      # ---------- 5. 查询 usage ----------
      - name: Query usage
        run: |
          echo "=== 3. 查询 usage ==="
          curl -sS -X GET 'https://openapi.qoder.com.cn/sash/api/v2/me/usage' \
            -H 'Connection: keep-alive' \
            -H 'sec-ch-ua-platform: "Windows"' \
            -H "User-Agent: ${UA}" \
            -H 'sec-ch-ua: "Not;A=Brand";v="8", "Chromium";v="150"' \
            -H 'sec-ch-ua-mobile: ?0' \
            -H 'Accept: */*' \
            -H 'Sec-Fetch-Site: none' \
            -H 'Sec-Fetch-Mode: no-cors' \
            -H 'Sec-Fetch-Dest: empty' \
            -H 'Accept-Language: zh-CN' \
            -H "Authorization: Bearer ${QODER_AUTH}" \
            -H 'Cosy-ClientType: 10' \
            -H "Cosy-Version: ${COSY_VERSION}" \
            -H "Cosy-MachineOS: ${COSY_MACHINE_OS}" \
            -H "Cosy-MachineHostname: ${COSY_MACHINE_HOSTNAME}" \
            -H "Cosy-MachineId: ${QODER_MACHINEID}" \
            -H "Cosy-MachineToken: ${QODER_MACHINETOKEN}" \
            -H "Cosy-MachineCode: ${QODER_MACHINECODE}" \
            -H "Cosy-MachineType: ${COSY_MACHINE_TYPE}" \
            --compressed -o /tmp/usage.json -w '%{http_code}' > /tmp/usage.code
          echo "HTTP=$(cat /tmp/usage.code)"
          cat /tmp/usage.json; echo

      # ---------- 6. 检查 HTTP 码，异常则失败 ----------
      - name: Check HTTP codes
        run: |
          FAIL=0
          for n in campaigns claim usage; do
            CODE=$(cat /tmp/$n.code 2>/dev/null || echo "")
            if [ -z "$CODE" ]; then
              echo "::warning::$n 没有产生响应码（可能被跳过）"
            elif [ "$CODE" != "200" ]; then
              echo "::error::$n 返回 HTTP $CODE"
              FAIL=1
            fi
          done
          if [ "$FAIL" = "1" ]; then
            echo "有接口返回非 200，可能 token 过期或被风控"
            exit 1
          fi

      # ---------- 7. 成功通知 ----------
      - name: Notify (success)
        if: success()
        run: |
          CLAIM=$(cat /tmp/claim.json 2>/dev/null | head -c 400)
          USAGE=$(cat /tmp/usage.json 2>/dev/null | head -c 400)
          SKIP="${{ steps.parse.outputs.skip }}"
          if [ "$SKIP" = "true" ]; then
            TITLE="ℹ️ Qoder 今日已签到"
            BODY="没有可领取的签到活动（今日已领过）。\n\n**Usage**\n\`\`\`${USAGE}\`\`\`"
          else
            TITLE="✅ Qoder 签到成功"
            BODY="**签到响应**\n\`\`\`${CLAIM}\`\`\`\n\n**Usage**\n\`\`\`${USAGE}\`\`\`"
          fi
          curl -sS -X POST "https://sctapi.ftqq.com/${SERVERCHAN_KEY}.send" \
            --data-urlencode "title=${TITLE}" \
            --data-urlencode "desp=${BODY}"

      # ---------- 8. 失败通知 ----------
      - name: Notify (failure)
        if: failure()
        run: |
          CAMPAIGNS=$(cat /tmp/campaigns.json 2>/dev/null | head -c 400)
          CLAIM=$(cat /tmp/claim.json 2>/dev/null | head -c 400)
          curl -sS -X POST "https://sctapi.ftqq.com/${SERVERCHAN_KEY}.send" \
            --data-urlencode "title=❌ Qoder 签到失败" \
            --data-urlencode "desp=请检查 token 是否过期。\n\n**campaigns**\n\`\`\`${CAMPAIGNS}\`\`\`\n\n**claim**\n\`\`\`${CLAIM}\`\`\`\n\n[查看日志](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"

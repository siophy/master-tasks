name: Qoder Daily Checkin

on:
  schedule:
    - cron: '19 21 * * *'
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - name: Claim daily reward
        id: claim
        env:
          QODER_AUTH: ${{ secrets.QODER_AUTH }}
          QODER_MACHINETOKEN: ${{ secrets.QODER_MACHINETOKEN }}
          QODER_MACHINECODE: ${{ secrets.QODER_MACHINECODE }}
          QODER_MACHINEID: ${{ secrets.QODER_MACHINEID }}
        run: |
          echo "=== 1. 签到 ==="
          curl -sS -X POST \
            'https://openapi.qoder.com.cn/sash/api/v1/me/campaigns/01a12102-9c4c-7460-a08b-61180061ac65/claim' \
            -H 'Accept: */*' \
            -H "Authorization: Bearer ${QODER_AUTH}" \
            -H 'Cosy-ClientType: 10' \
            -H 'Cosy-Version: 0.4.3' \
            -H 'Cosy-MachineOS: x86_64_win32' \
            -H 'Cosy-MachineHostname: Mee-Laptop' \
            -H 'Cosy-MachineId: ${QODER_MACHINEID}' \
            -H "Cosy-MachineToken: ${QODER_MACHINETOKEN}" \
            -H 'Cosy-MachineCode: ${QODER_MACHINECODE}' \
            -H 'Cosy-MachineType: bd8aae611435da798e' \
            -H 'Origin: https://openapi.qoder.com.cn' \
            -H 'Referer: https://openapi.qoder.com.cn/growth-page/activity-iframe' \
            -H 'User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) QoderCN/0.4.3 Chrome/150.0.7871.114 Electron/43.1.1 Safari/537.36' \
            --compressed -o /tmp/claim.json -w '%{http_code}' > /tmp/claim.code
          cat /tmp/claim.json; echo
          echo "HTTP=$(cat /tmp/claim.code)"

      - name: Random wait
        run: |
          DELAY=$((RANDOM % 8 + 3))
          echo "等待 ${DELAY} 秒..."
          sleep "$DELAY"

      - name: Query usage
        id: usage
        env:
          QODER_AUTH: ${{ secrets.QODER_AUTH }}
        run: |
          echo "=== 3. 查询 usage ==="
          curl -sS -X GET 'https://openapi.qoder.com.cn/sash/api/v2/me/usage' \
            -H 'accept: application/json' \
            -H "authorization: Bearer ${QODER_AUTH}" \
            -H 'cosy-clienttype: 10' \
            -H 'user-agent: Qoder' \
            -H 'Sec-Fetch-Site: none' \
            -H 'Sec-Fetch-Mode: no-cors' \
            -H 'Sec-Fetch-Dest: empty' \
            --compressed -o /tmp/usage.json -w '%{http_code}' > /tmp/usage.code
          cat /tmp/usage.json; echo
          echo "HTTP=$(cat /tmp/usage.code)"

      - name: Notify (success)
        if: success()
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: |
          CLAIM=$(cat /tmp/claim.json 2>/dev/null | head -c 300)
          USAGE=$(cat /tmp/usage.json 2>/dev/null | head -c 300)
          curl -sS -X POST "https://sctapi.ftqq.com/${SERVERCHAN_KEY}.send" \
            --data-urlencode "title=✅ Qoder 签到成功" \
            --data-urlencode "desp=**签到**\`\`\`${CLAIM}\`\`\`\n\n**Usage**\`\`\`${USAGE}\`\`\`"

      - name: Notify (failure)
        if: failure()
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: |
          CLAIM=$(cat /tmp/claim.json 2>/dev/null | head -c 300)
          USAGE=$(cat /tmp/usage.json 2>/dev/null | head -c 300)
          curl -sS -X POST "https://sctapi.ftqq.com/${SERVERCHAN_KEY}.send" \
            --data-urlencode "title=❌ Qoder 签到失败" \
            --data-urlencode "desp=请检查 token 是否过期。\n\n**签到**\`\`\`${CLAIM}\`\`\`\n\n**Usage**\`\`\`${USAGE}\`\`\`\n\n[查看日志](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"

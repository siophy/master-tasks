# .github/workflows/restart_hf_space.yaml
name: Restart HF Space
on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: '手动触发原因（可选）'
        required: false
        default: '手动保活'
jobs:
  restart-space:
    runs-on: ubuntu-latest
    env:
      REPO_IDS: ${{ secrets.SPACE_REPO_ID }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装依赖
        run: pip install huggingface_hub -q
      - name: 设置触发信息
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "TYPE=AUTO" >> $GITHUB_ENV
          else
            echo "TYPE=MANUAL" >> $GITHUB_ENV
            echo "REASON=${{ inputs.reason || '手动保活' }}" >> $GITHUB_ENV
          fi
     
      - name: 重启所有 Spaces
        run: |
          IFS=',' read -ra REPOS <<< "$REPO_IDS"
          SUCCESS_COUNT=0
          TOTAL_COUNT=${#REPOS[@]}
          for REPO in "${REPOS[@]}"; do
            REPO=$(echo "$REPO" | xargs) # 去空格
            [ -z "$REPO" ] && continue # 防止空值
            echo "正在唤醒 → $REPO"
            if python restart_space.py "$REPO"; then
              echo "【$REPO】重启成功"
              SUCCESS_COUNT=$((SUCCESS_COUNT + 1))  # ← 只改这一行！
            else
              echo "【$REPO】重启失败"
            fi
          done
          if [ $SUCCESS_COUNT -eq $TOTAL_COUNT ]; then
            echo "OK=true" >> $GITHUB_ENV
          else
            echo "OK=false" >> $GITHUB_ENV
          fi
         
      - name: 发送 Telegram 通知
        if: always()
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "未配置 TG，跳过"
            exit 0
          fi
          TIME=$(date -d '+8 hours' '+%Y-%m-%d %H:%M:%S')
          if [[ $OK == "true" ]]; then
            STATUS="成功 🎉"
          else
            STATUS="失败 ❌"
          fi
          REPO_LIST=$(echo "$REPO_IDS" | sed 's/,/\n/g' | sed 's/^/ • /')
          if [[ $TYPE == "AUTO" ]]; then
            TEXT="🤖 HF Space 自动保活%0A%0A⏰ 北京时间 <code>$TIME</code>%0A%0A🛰 以下 Space 已保活：%0A$REPO_LIST%0A%0A✅ 保活 $STATUS"
          else
            TEXT="🖐 HF Space 手动保活%0A%0A👤 触发人: ${{ github.actor }}%0A📝 原因: $REASON%0A🛰 以下 Space 已保活：%0A$REPO_LIST%0A%0A✅ 保活 $STATUS"
          fi
          curl -fs \
               -X POST \
               "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
               -d "chat_id=$CHAT_ID" \
               -d "text=$TEXT" \
               -d "parse_mode=HTML" \
               -d "disable_web_page_preview=true" > /dev/null
          echo "Telegram 通知已发送"